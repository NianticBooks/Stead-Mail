[package]
name = "desktop"
version.workspace = true
description = "AI-native mail and calendar client (desktop shell)"
authors = ["Fred Book"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serve the embedded frontend instead of the dev server. Release builds must enable it
# (`tauri build` does so itself; plain `cargo build --release` needs --features custom-protocol).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
mailcore = { path = "../../../crates/mailcore" }
tauri-plugin-dialog = "2.8.4"
tokio = { workspace = true, features = ["time"] }
