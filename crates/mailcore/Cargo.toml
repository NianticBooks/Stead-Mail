[package]
name = "mailcore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-agnostic mail + calendar core: sync engine, storage, secrets, RPC API"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.11"
futures-util = "0.3.34"
mail-parser = "1.0.0"
directories = "6.0.0"
keyring = "4.2.0"
rpassword = "7.5.4"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
getrandom = "0.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
